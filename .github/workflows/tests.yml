name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: at/pom.xml

      # The AT dependency is the exact consensus artifact qortium-core vendors.
      # Installing it directly keeps CI deterministic and byte-identical to the
      # jar Core ships, instead of trusting a JitPack rebuild.
      - name: Install pinned CIYAM AT runtime
        run: |
          base=https://raw.githubusercontent.com/QortiumDev/qortium-core/5f4fc2c666ee491889cb93fb85a9c7294d76a2e8/lib/com/github/QortiumDev/AT/0525eec
          curl -fsSLO "$base/AT-0525eec.jar"
          curl -fsSLO "$base/AT-0525eec.pom"
          echo "13fb9fa39dbef560d717c825e4c0a7b675257eb4caf4cdabcc6597350158aecd  AT-0525eec.jar" | sha256sum -c -
          echo "dd590a2735c3933f662b6da6d075483a51157e0773bdc5f0bc79b8daa768cd33  AT-0525eec.pom" | sha256sum -c -
          mvn -B install:install-file -Dfile=AT-0525eec.jar -DpomFile=AT-0525eec.pom

      - name: Build and test
        run: mvn -B clean verify -DskipTests=false --file at/pom.xml

      - name: Test operator safety tooling
        run: bash scripts/test-smpl-faucet-tooling.sh

      - name: Verify canonical creation bytes are non-empty
        run: |
          files=$(git ls-files 'at/*creation-bytes.txt')
          test -n "$files"
          for f in $files; do test -s "$f"; done
